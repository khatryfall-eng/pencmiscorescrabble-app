name: Build APK Android — PÉNC MI

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances du projet
        run: npm install

      - name: Construire l'application web
        run: npm run build

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: pencmi-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
